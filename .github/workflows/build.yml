name: Build prometheus-exporters Sysext

# Builds prometheus-exporters.raw and publishes it as a release tagged
# v<YYYY.MM.DD>-r<run>. One release serves every TrueNAS train (userspace
# only), but it is approved per train:
#   - it is always published as a PRERELEASE, and one hardware-test issue is
#     opened per train in .github/tracked-versions.json (`hardware-test` for a
#     stable train, `preview-hardware-test` for a preview one);
#   - closing a train's issue as completed approves the release for that
#     train's boxes only (promote.yml adds a verified-train marker to its
#     notes); get.sh installs only releases approved for the box's train.
# There is no publish-straight-to-Latest option: a full release with no
# verified-train marker counts as approved for every train (that is how
# releases from before per-train sign-off stay installable), so it would
# reach every box untested.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Debian suite to bundle FreeIPMI against (blank = tracked)'
        required: false
        default: ''

  workflow_call:
    inputs:
      suite:
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: build-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  SYSEXT_ROOT: /tmp/pe-sysext

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.params.outputs.suite }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/tracked-versions.json
          sparse-checkout-cone-mode: false
      - name: Resolve build parameters
        id: params
        env:
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          TRACKED_SUITE=$(jq -r '.debian.suite' .github/tracked-versions.json)
          SUITE="${INPUT_SUITE:-$TRACKED_SUITE}"
          echo "suite=${SUITE}" >> "$GITHUB_OUTPUT"
          echo "Resolved: suite=${SUITE}"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Debian container so FreeIPMI is apt-installable and bundled against the
    # pinned (oldest-supported) glibc; the Go exporters are static and arch-
    # independent of the suite.
    container: debian:${{ needs.resolve.outputs.suite }}-slim
    outputs:
      run_number: ${{ steps.build_id.outputs.run_number }}
      build_date: ${{ steps.build_id.outputs.build_date }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl tar gzip xz-utils \
            squashfs-tools zstd patchelf jq coreutils git dpkg-dev

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute build identifier
        id: build_id
        run: |
          echo "run_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Initialize sysext tree
        run: |
          rm -rf "${SYSEXT_ROOT}"
          mkdir -p "${SYSEXT_ROOT}/usr/bin"
          mkdir -p "${SYSEXT_ROOT}/usr/lib/systemd/system"
          mkdir -p "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/configs-seed"
          mkdir -p "${SYSEXT_ROOT}/usr/lib/extension-release.d"
          echo "ID=_any" > "${SYSEXT_ROOT}/usr/lib/extension-release.d/extension-release.prometheus-exporters"
          : > "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/exporters.txt"
          : > "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/versions.txt"

      - name: Fetch exporters
        run: |
          TVERS=.github/tracked-versions.json
          jq -c '.exporters | to_entries[] | {name: .key} + .value' "$TVERS" \
          | while IFS= read -r row; do
              name=$(jq -r '.name' <<<"$row")
              repo=$(jq -r '.repo' <<<"$row")
              version=$(jq -r '.version' <<<"$row")
              asset=$(jq -r '.asset' <<<"$row")
              extract=$(jq -r '.extract // ""' <<<"$row")
              cfg_name=$(jq -r '.config.name // ""' <<<"$row")
              cfg_from=$(jq -r '.config.from // ""' <<<"$row")
              vnum="${version#v}"

              # Expand {version}/{vnum} templates.
              expand() { local s="$1"; s="${s//\{version\}/$version}"; s="${s//\{vnum\}/$vnum}"; printf '%s' "$s"; }
              asset_r="$(expand "$asset")"
              extract_r="$(expand "$extract")"
              cfg_from_r="$(expand "$cfg_from")"

              echo "=== ${name} ${version} ==="
              work=$(mktemp -d)
              dl="https://github.com/${repo}/releases/download/${version}/${asset_r}"
              echo "  fetching ${dl}"
              curl -fSL --retry 3 --max-time 300 "$dl" -o "${work}/${asset_r}"

              if [ -z "$extract_r" ]; then
                install -m 0755 "${work}/${asset_r}" "${SYSEXT_ROOT}/usr/bin/${name}"
              else
                tar -xzf "${work}/${asset_r}" -C "$work"
                if [ ! -f "${work}/${extract_r}" ]; then
                  echo "::error title=fetch::${name}: '${extract_r}' not found in ${asset_r}" >&2
                  find "$work" -maxdepth 2 -type f >&2 || true
                  exit 1
                fi
                install -m 0755 "${work}/${extract_r}" "${SYSEXT_ROOT}/usr/bin/${name}"
                # Seed the example config (if this exporter ships one).
                if [ -n "$cfg_name" ] && [ -n "$cfg_from_r" ]; then
                  if [ ! -f "${work}/${cfg_from_r}" ]; then
                    echo "::error title=fetch::${name}: config '${cfg_from_r}' not found in ${asset_r}" >&2
                    exit 1
                  fi
                  install -m 0644 "${work}/${cfg_from_r}" \
                    "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/configs-seed/${cfg_name}"
                  echo "  seeded config: ${cfg_name}"
                fi
              fi
              echo "${name}" >> "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/exporters.txt"
              printf '%-20s %s\n' "$name" "$version" \
                >> "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/versions.txt"
              rm -rf "$work"
            done

      - name: Bundle FreeIPMI for ipmi_exporter
        run: |
          TVERS=.github/tracked-versions.json
          PKG=$(jq -r '.freeipmi.package' "$TVERS")
          echo "Installing FreeIPMI package: ${PKG}"
          apt-get install -y --no-install-recommends "$PKG"
          # Reuse the private-lib + rpath bundler from cli-tools. Append its
          # binary names to a scratch manifest so the exporter manifest stays
          # exporter-only.
          .github/scripts/bundle-apt-tool.sh "${SYSEXT_ROOT}" "$PKG" /tmp/freeipmi-bins.txt
          VER=$(dpkg-query -W -f='${Version}' "$PKG" 2>/dev/null || echo '?')
          printf '%-20s %s (apt:%s, GPLv3)\n' "freeipmi" "$VER" "$PKG" \
            >> "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/versions.txt"
          echo "FreeIPMI tools bundled:"
          sort /tmp/freeipmi-bins.txt | sed 's/^/  /'

      - name: Assemble units + finalize tree
        run: |
          # systemd unit files (static, from the repo).
          cp sysext/usr/lib/systemd/system/*.service \
             "${SYSEXT_ROOT}/usr/lib/systemd/system/"
          # Bundle the PREINIT script so install.sh can extract it from the .raw.
          install -m 0755 scripts/prometheus-exporters-preinit.sh \
            "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/prometheus-exporters-preinit.sh"

          sort -u -o "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/exporters.txt" \
                     "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/exporters.txt"

          echo "=== Exporters ==="
          cat "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/exporters.txt"
          echo "=== Versions ==="
          cat "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/versions.txt"
          echo "=== Tree ==="
          find "${SYSEXT_ROOT}" -type f -o -type l | sort

      - name: Create prometheus-exporters.raw squashfs
        run: |
          mksquashfs "${SYSEXT_ROOT}" prometheus-exporters.raw -noappend -comp zstd -all-root
          ls -lh prometheus-exporters.raw
          unsquashfs -l prometheus-exporters.raw | head -80

      - name: Smoke-test prometheus-exporters.raw
        run: |
          SMOKE=$(mktemp -d); trap 'rm -rf "$SMOKE"' EXIT
          unsquashfs -d "${SMOKE}/x" prometheus-exporters.raw
          fail=0

          EXT="${SMOKE}/x/usr/lib/extension-release.d/extension-release.prometheus-exporters"
          { [ -f "$EXT" ] && grep -qx 'ID=_any' "$EXT"; } || {
            echo "::error title=smoke::extension-release missing or not ID=_any" >&2; fail=1; }

          [ -x "${SMOKE}/x/usr/lib/prometheus-exporters/prometheus-exporters-preinit.sh" ] || {
            echo "::error title=smoke::preinit script missing" >&2; fail=1; }

          # Every exporter: binary + unit present, and runs --version here.
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            if [ -x "${SMOKE}/x/usr/bin/${name}" ]; then echo "  ok: bin ${name}"; else
              echo "::error title=smoke::missing binary usr/bin/${name}" >&2; fail=1; fi
            if [ -f "${SMOKE}/x/usr/lib/systemd/system/${name}.service" ]; then echo "  ok: unit ${name}.service"; else
              echo "::error title=smoke::missing unit ${name}.service" >&2; fail=1; fi
            if "${SMOKE}/x/usr/bin/${name}" --version >/dev/null 2>&1; then echo "  runs: ${name} --version"; else
              echo "::error title=smoke::${name} --version failed" >&2; fail=1; fi
          done < "${SMOKE}/x/usr/lib/prometheus-exporters/exporters.txt"

          # config-bearing exporters must have seeded a default config.
          for c in blackbox.yml snmp.yml; do
            [ -f "${SMOKE}/x/usr/lib/prometheus-exporters/configs-seed/${c}" ] \
              && echo "  ok: config-seed ${c}" \
              || { echo "::error title=smoke::missing seed config ${c}" >&2; fail=1; }
          done

          # FreeIPMI must be bundled and self-contained (no missing libs).
          IPMIMON="${SMOKE}/x/usr/sbin/ipmimonitoring"
          if [ -x "$IPMIMON" ]; then
            echo "  ok: FreeIPMI ipmimonitoring bundled"
            if ldd "$IPMIMON" 2>/dev/null | grep -q 'not found'; then
              echo "::error title=smoke::ipmimonitoring has unresolved libraries:" >&2
              ldd "$IPMIMON" | grep 'not found' >&2; fail=1
            else
              echo "  ok: ipmimonitoring libraries resolve"
            fi
          else
            echo "::error title=smoke::FreeIPMI ipmimonitoring not bundled at usr/sbin/ipmimonitoring" >&2; fail=1
          fi

          [ "$fail" -eq 0 ] || { echo "::error title=smoke::validation failed, refusing to publish" >&2; exit 1; }
          echo "smoke-test OK"

      - name: Generate checksum
        run: |
          sha256sum prometheus-exporters.raw > prometheus-exporters.raw.sha256
          cat prometheus-exporters.raw.sha256

      - name: Render release notes
        env:
          SUITE: ${{ needs.resolve.outputs.suite }}
          BUILD_DATE: ${{ steps.build_id.outputs.build_date }}
          RUN_NUMBER: ${{ steps.build_id.outputs.run_number }}
          BUILD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          TAG="v${BUILD_DATE}-r${RUN_NUMBER}"
          TRAINS=$(jq -r '[.trains[].name] | join(", ")' .github/tracked-versions.json)
          GET="https://raw.githubusercontent.com/${REPO}/main/get.sh"
          {
            echo "## prometheus-exporters sysext for TrueNAS SCALE"
            echo ""
            echo "A bundle of Prometheus exporters, merged into \`/usr\` via systemd-sysext."
            echo "Kernel-independent: this single release works on every TrueNAS version."
            echo "Exporters ship **disabled**; enable them with \`install.sh --enable=...\`."
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Built (UTC) | \`${BUILD_DATE}\` |"
            echo "| FreeIPMI apt base | Debian \`${SUITE}\` |"
            echo "| Source commit | [\`${BUILD_SHA}\`](https://github.com/${REPO}/commit/${BUILD_SHA}) |"
            echo ""
            echo "### Included exporters"
            echo '```'
            cat "${SYSEXT_ROOT}/usr/lib/prometheus-exporters/versions.txt"
            echo '```'
            echo ""
            echo "### Approval"
            echo "This release starts as a pre-release. A hardware test on a TrueNAS train (${TRAINS}) approves it for that train's boxes only; until then the one-liner keeps installing the newest release approved for each train."
            echo ""
            echo "### Install + enable"
            echo "The newest release approved for your TrueNAS train:"
            echo '```bash'
            echo "curl -fsSL ${GET} | sudo bash -s -- --enable=node_exporter,smartctl_exporter"
            echo '```'
            echo "This exact release:"
            echo '```bash'
            echo "curl -fsSL ${GET} | sudo bash -s -- --release=${TAG} --enable=node_exporter,smartctl_exporter"
            echo '```'
            echo ""
            echo "### Licensing"
            echo "Repository code is MIT. Bundled exporters keep their upstream licenses"
            echo "(Apache-2.0 / MIT). The bundled **FreeIPMI** binaries are **GPLv3**"
            echo "(source: Debian \`freeipmi\` package). No proprietary binaries are shipped."
          } > release-notes.md
          cat release-notes.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pe-sysext-${{ steps.build_id.outputs.build_date }}-r${{ steps.build_id.outputs.run_number }}
          path: |
            prometheus-exporters.raw
            prometheus-exporters.raw.sha256
            release-notes.md

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      # scripts/ for the release assets, .github/ for tracked-versions.json
      # (the trains the hardware-test issues are opened for).
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github
          sparse-checkout-cone-mode: true
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: pe-sysext-${{ needs.build.outputs.build_date }}-r${{ needs.build.outputs.run_number }}
      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.build_date }}-r${{ needs.build.outputs.run_number }}
          name: "prometheus-exporters ${{ needs.build.outputs.build_date }} (r${{ needs.build.outputs.run_number }})"
          body_path: release-notes.md
          # Everything get.sh runs or stages from a release: install.sh + lib
          # (+ the image and checksum for install.sh to download), and
          # uninstall.sh + restore.sh + lib (tests/test_get_sh.py checks this).
          files: |
            prometheus-exporters.raw
            prometheus-exporters.raw.sha256
            scripts/prometheus-exporters-lib.sh
            scripts/install.sh
            scripts/restore.sh
            scripts/uninstall.sh
          # Draft first so assets attach even on immutable-release repos.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the draft as a prerelease, always: it is approved per train
      # only by that train's hardware-test issue (promote.yml).
      - name: Publish the draft as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REL_ID: ${{ steps.release.outputs.id }}
        run: gh api --method PATCH "repos/${REPO}/releases/${REL_ID}" -F draft=false -F prerelease=true

      - name: Open hardware-test issues, one per train (prerelease gate)
        uses: actions/github-script@v9
        env:
          BUILD_DATE: ${{ needs.build.outputs.build_date }}
          RUN_NUMBER: ${{ needs.build.outputs.run_number }}
        with:
          script: |
            const tag = `v${process.env.BUILD_DATE}-r${process.env.RUN_NUMBER}`;
            const { owner, repo } = context.repo;
            const releaseUrl = `https://github.com/${owner}/${repo}/releases/tag/${tag}`;
            const fs = require('fs');
            // One issue per supported TrueNAS train: a hardware test approves this
            // release for its own train's boxes only (promote.yml). Stable trains use
            // the hardware-test label, preview (beta) trains preview-hardware-test.
            const { trains } = JSON.parse(fs.readFileSync('.github/tracked-versions.json', 'utf8'));
            const labelOf = (t) => (t.channel === 'preview' ? 'preview-hardware-test' : 'hardware-test');
            const labels = {
              'hardware-test': { color: 'FBCA04',
                description: 'Build awaiting verification on real hardware' },
              'preview-hardware-test': { color: '5319E7',
                description: 'Build awaiting verification on real hardware, on a TrueNAS preview (beta) train' },
            };
            for (const name of new Set(trains.map(labelOf))) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, ...labels[name] });
              } catch (e) { if (e.status !== 422) throw e; }
            }
            // Duplicate check, keyed on tag AND train: an open issue whose markers
            // (or title) name both already covers the pair. An open issue for this tag
            // with no train marker and no train in its title is the single issue from
            // before per-train sign-off: it covered every train (promote.yml still
            // approves it for all of them), so it suppresses them all.
            const open = [];
            for (const name of Object.keys(labels)) {
              open.push(...(await github.rest.issues.listForRepo({ owner, repo,
                state: 'open', labels: name, per_page: 100 })).data);
            }
            const issueTag = (i) => ((i.body || '').match(/<!--\s*release-tag:\s*(\S+?)\s*-->/) || [])[1] || '';
            const issueTrain = (i) => ((i.body || '').match(/<!--\s*train:\s*(\S+?)\s*-->/) || [])[1] || '';
            const covers = (i, t) => {
              if (issueTag(i) !== tag && !i.title.endsWith(` ${tag}`)) return false;
              if (issueTrain(i)) return issueTrain(i) === t.key;
              const named = trains.find((x) => i.title.includes(`any ${x.name} system,`));
              return named ? named.key === t.key : true;
            };
            // Test instructions. Every command must work exactly as written on a
            // TrueNAS box: a human validator pastes them. The one-liner runs main's
            // get.sh (what users run); --release makes it run this release's
            // install.sh, which then downloads this release's image.
            const inst = `https://raw.githubusercontent.com/${owner}/${repo}/main/get.sh`;
            const ports = '9100 9633 9199 9115 9116 9290';
            const portLoop = `for p in ${ports}; do printf '%s ' "$p"; curl -s -o /dev/null -w '%{http_code}\\n' "localhost:$p/metrics"; done   # 200 for each`;
            for (const t of trains) {
              const preview = t.channel === 'preview';
              // Title: what to test | on what | which build. The train names the "on
              // what"; the tag goes last, verbatim (the duplicate check matches it).
              const title = `${preview ? 'Preview hardware test' : 'Hardware test'}: Prometheus exporters ${process.env.BUILD_DATE} | any ${t.name} system, no special hardware | ${tag}`;
              const dup = open.find((i) => covers(i, t));
              if (dup) {
                console.log(`Open issue #${dup.number} already covers ${tag} on ${t.name}, skipping`);
                continue;
              }
              const others = trains.filter((x) => x.key !== t.key).map((x) => x.name);
              await github.rest.issues.create({ owner, repo, title, labels: [labelOf(t)],
                body: [
                  `The build smoke-tested this release in CI. This issue approves it for **${t.name}** boxes only: verify it **on real hardware, on a ${t.name} box**.${others.length ? ` ${others.join(', ')} ${others.length > 1 ? 'have their own issues' : 'has its own issue'} for this release.` : ''}`,
                  ``,
                  `**Release:** [${tag}](${releaseUrl})`,
                  `**Train:** ${t.name} (\`cat /etc/version\` starts with \`${t.key}.\`)`,
                  `<!-- release-tag: ${tag} -->`,
                  `<!-- train: ${t.key} -->`,
                  ``,
                  `### Requirements`,
                  `- A ${t.name} box with a data pool. The sysext is userspace only (no kernel module), so one build serves every train, but each train signs it off on its own.`,
                  `- The test enables all six exporters (node 9100, smartctl 9633, nut 9199, blackbox 9115, snmp 9116, ipmi 9290). ipmi_exporter only reads sensors on a box with a BMC (\`/dev/ipmi0\`); without one it still runs and reports \`ipmi_up 0\`.`,
                  ``,
                  `### 1. Pre-checks`,
                  "```bash",
                  `cat /etc/version                       # starts with ${t.key}. (this issue's train)`,
                  `sudo ss -ltnp | grep -E ':(${ports.split(' ').join('|')})\\s'   # empty, or only *_exporter from an earlier install`,
                  `ls -l /dev/ipmi0                       # present = BMC, so ipmi_exporter can read sensors`,
                  "```",
                  ``,
                  `### 2. Install this build`,
                  `No hardware test has approved it for ${t.name} yet, so plain \`get.sh\` would install the newest approved release instead. Pin this build with \`--release\`:`,
                  "```bash",
                  `I=${inst}`,
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag} --enable=all   # "Release: ${tag} (downloading from its assets)", "Checksum OK", "started <name>" for all six; add --pool=NAME if it asks`,
                  "```",
                  ``,
                  `### 3. Verify`,
                  "```bash",
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag} --check   # every exporter "binary present" + "service active", 0 fail (PREINIT only warns until step 4)`,
                  `cat /usr/lib/prometheus-exporters/versions.txt   # matches "Included exporters" in the release notes`,
                  portLoop,
                  `curl -s localhost:9100/metrics | grep -c '^node_zfs_'          # > 0 (ZFS collector works)`,
                  `curl -s localhost:9633/metrics | grep -c '^smartctl_device{'   # one per disk`,
                  `curl -s localhost:9290/metrics | grep '^ipmi_up'              # 1 per collector with a BMC, 0 without`,
                  "```",
                  ``,
                  `### 4. Reboot and re-verify`,
                  "```bash",
                  `sudo reboot`,
                  "```",
                  `After it is back up:`,
                  "```bash",
                  `I=${inst}`,
                  `curl -fsSL "$I" | sudo bash -s -- --release=${tag} --check   # "PREINIT completed this boot", every exporter active, 0 fail`,
                  portLoop,
                  "```",
                  ``,
                  `### 5. Report and sign off`,
                  `Comment with \`cat /etc/version\`, BMC or not, and the step 4 output of \`--check\` and the port loop. Sign off here only for a test on ${t.name}.`,
                  `- Works: close this issue as **completed**. That approves [\`${tag}\`](${releaseUrl}) for ${t.name} boxes: promote.yml adds a \`verified-train: ${t.key}\` marker to its notes, and \`get.sh\` then installs it there. The first train to approve a release also makes it a full release and appends the changelog.`,
                  `- Broken: comment what failed, then close as **not planned**. Nothing changes: ${t.name} boxes keep the newest release approved for them.`,
                  ``,
                  `Afterwards, to keep only some exporters: \`curl -fsSL "$I" | sudo bash -s -- --release=${tag} --disable=nut_exporter,blackbox_exporter,snmp_exporter,ipmi_exporter\`.`,
                ].join('\n') });
              console.log(`Created ${labelOf(t)} issue for ${tag} on ${t.name}`);
            }
